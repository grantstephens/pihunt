# Stage 3 sweep: periods to 40, mixed degree up to 3, C = 10^5.
name   = "base10-wide"
output = "results/base10-wide.jsonl"

[defaults]
coeff_bound = 100000
finder      = "multilevel"
escalate    = 2
max_columns = 100

[search]
mode    = "grid"
bases   = [10, 100, 1000]
periods = { from = 2, to = 40 }
degrees = [[1, 1], [2, 2], [1, 2], [1, 3]]
extras  = [[], ["log2", "log3", "log5"], ["pi2", "log2", "log3", "log5", "catalan", "zeta3"]]
