<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pihunt digits demo</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 60rem; }
  .digits { font-family: ui-monospace, Menlo, Consolas, monospace; word-break: break-all; }
  .lane { border: 1px solid #ccc; padding: 0.75rem; margin: 0.5rem 0; }
  .warning { color: #a15c00; }
  .error, .mismatch { color: #b00020; font-weight: bold; }
  .match { color: #0a7a2f; font-weight: bold; }
  .hidden { display: none; }
  fieldset { margin-bottom: 1rem; }
  .stream-block { display: inline-block; margin: 0 0.5rem 0.25rem 0; }
</style>
</head>
<body>
<h1>pihunt: race &amp; stream demo</h1>

<section id="race-panel">
  <h2>Race: Theorem 1 vs Theorem 2</h2>
  <fieldset>
    <legend>Position</legend>
    <label for="race-pos">Position (1&ndash;200,000)</label>
    <input type="text" id="race-pos" value="1000" inputmode="numeric" autocomplete="off">
    <button type="button" data-race-preset="1000">1,000</button>
    <button type="button" data-race-preset="10000">10,000</button>
    <button type="button" data-race-preset="50000">50,000</button>
    <button type="button" data-race-preset="100000">100,000</button>
    <button type="button" id="race-start">Race</button>
    <button type="button" id="race-cancel">Cancel</button>
    <p id="race-error" class="error hidden"></p>
    <p id="race-warning" class="warning hidden">This may take a minute or more in the browser.</p>
  </fieldset>

  <div class="lane" id="lane-thm1">
    <h3>Theorem 1</h3>
    <p>Elapsed: <span id="thm1-timer">&ndash;</span></p>
    <p class="digits" id="thm1-digits"></p>
    <p>Time: <span id="thm1-ms">&ndash;</span> &middot; Memory: <span id="thm1-mem">&ndash;</span></p>
  </div>
  <div class="lane" id="lane-thm2">
    <h3>Theorem 2</h3>
    <p>Elapsed: <span id="thm2-timer">&ndash;</span></p>
    <p class="digits" id="thm2-digits"></p>
    <p>Time: <span id="thm2-ms">&ndash;</span> &middot; Memory: <span id="thm2-mem">&ndash;</span></p>
  </div>

  <p id="lanes-agreement"></p>
  <p id="reference-check"></p>
</section>

<section id="stream-panel">
  <h2>Stream</h2>
  <fieldset>
    <legend>Start position</legend>
    <label for="stream-pos">Start position (1&ndash;200,000)</label>
    <input type="text" id="stream-pos" value="1" inputmode="numeric" autocomplete="off">
    <button type="button" id="stream-start">Start</button>
    <button type="button" id="stream-stop">Stop</button>
    <p id="stream-error" class="error hidden"></p>
  </fieldset>
  <p>Memory: <span id="stream-mem">&ndash;</span></p>
  <div class="digits" id="stream-output"></div>
</section>

<script type="module" src="./demo.js"></script>
</body>
</html>
