[package]
name = "pihunt"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
# Link the system GMP/MPFR instead of building them from source.
gmp-mpfr-sys = { version = "1.7.1", features = ["use-system-libs"] }
jiff = "0.2.37"
rayon = "1.12.0"
rug = "1.30.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sobol_burley = "0.5.0"
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"
